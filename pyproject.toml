[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "social-detective"
version = "1.0.0"
description = "FaceTrace — Face Search + Blockchain Verification CLI"
requires-python = ">=3.10"
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime>=1.16.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "serpapi>=1.0.0,<1.1.0",
    "instaloader>=4.13.0",
    "ddgs>=9.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "web3>=6.11.0",
    "py-solc-x>=2.0.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "Pillow>=10.0.0",
    "playwright>=1.40.0",
    "playwright-stealth>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
